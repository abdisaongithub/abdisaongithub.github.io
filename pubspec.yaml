name: flutter_portfolio_app
description: An interactive portfolio for Abdisa Tsegaye, built as a web-based operating system simulator.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  equatable: ^2.0.5

  flutter_bloc: ^9.1.1
  dio: ^5.3.3
  shared_preferences: ^2.2.1

  cached_network_image: ^3.3.0
  url_launcher: ^6.1.14
  web: ^1.1.0

  uuid: ^4.5.2
  flutter_markdown_plus: ^1.0.3
  flutter_highlight: ^0.7.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.6
  freezed: ^3.2.5
  json_serializable: ^6.7.1
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/android/
    - assets/icons/windows/
    - assets/images/
    - assets/svg/
    # Flutter does NOT recurse into subdirectories, so each project folder
    # must be declared explicitly or its manifest.json is never bundled.
    - assets/projects/portfolio/
    - assets/projects/ecommerce-app/
    - assets/projects/task-manager/
