<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description"
    content="The interactive portfolio of Abdisa Tsegaye, Flutter developer - a web-based OS you can actually use, with Windows, macOS, Ubuntu, Android and iOS modes.">
  <meta name="author" content="Abdisa Tsegaye">
  <meta name="keywords" content="Abdisa Tsegaye, Flutter developer, portfolio, Dart, mobile developer, web developer">
  <meta name="theme-color" content="#0F0F0F">
  <link rel="canonical" href="https://abdisaongithub.github.io/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Abdisa Portfolio OS">
  <meta property="og:title" content="Abdisa Tsegaye - Portfolio OS">
  <meta property="og:description"
    content="An interactive portfolio built as a web-based operating system. Boot it, sign in, and explore the work.">
  <meta property="og:url" content="https://abdisaongithub.github.io/">
  <meta property="og:image" content="https://abdisaongithub.github.io/icons/Icon-512.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Abdisa Tsegaye - Portfolio OS">
  <meta name="twitter:description"
    content="An interactive portfolio built as a web-based operating system. Boot it, sign in, and explore the work.">
  <meta name="twitter:image" content="https://abdisaongithub.github.io/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Abdisa Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Abdisa Tsegaye - Portfolio OS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0F0F0F;
      margin: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      background-color: #0F0F0F;
      transition: opacity 0.5s ease-out;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="loading" class="loading-container">
    <div class="spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = 0;
        setTimeout(function () {
          loading.remove();
        }, 500);
      }
    });
  </script>
</body>

</html>
