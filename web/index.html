  <style>
    :root { color-scheme: dark; }

    html, body {
      background-color: #08080B;
      margin: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Painted by the browser immediately, long before Flutter is ready, so
       the first seconds show the name rather than a blank screen. */
    #boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 8vw;
      background:
        radial-gradient(60rem 40rem at 80% -10%, rgba(110, 86, 207, .20), transparent 60%),
        radial-gradient(50rem 34rem at -10% 20%, rgba(46, 125, 209, .16), transparent 60%),
        #08080B;
      transition: opacity .45s ease-out;
    }

    #boot .pill {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      align-self: flex-start;
      padding: .4rem .75rem;
      border-radius: 999px;
      border: 1px solid rgba(61, 214, 140, .35);
      background: rgba(61, 214, 140, .10);
      color: #3DD68C;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .02em;
    }

    #boot .dot {
      width: .4rem;
      height: .4rem;
      border-radius: 50%;
      background: #3DD68C;
    }

    #boot h1 {
      margin: 1.5rem 0 0;
      font-size: clamp(2.2rem, 6.2vw, 4.4rem);
      line-height: 1.04;
      letter-spacing: -.035em;
      font-weight: 700;
      color: #F4F4F6;
    }

    #boot p {
      margin: 1rem 0 0;
      max-width: 34rem;
      font-size: clamp(.95rem, 1.6vw, 1.05rem);
      line-height: 1.6;
      color: #A1A1AE;
    }

    #boot .bar {
      margin-top: 2.5rem;
      width: min(18rem, 60vw);
      height: 3px;
      border-radius: 2px;
      background: #1C1C26;
      overflow: hidden;
    }

    #boot .bar i {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 2px;
      background: linear-gradient(90deg, #6E56CF, #9E8CFC);
      animation: slide 1.15s cubic-bezier(.4, 0, .2, 1) infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    #boot .hint {
      margin-top: .9rem;
      font-size: .74rem;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: #6B6B78;
    }

    @media (prefers-reduced-motion: reduce) {
      #boot .bar i { animation: none; width: 100%; }
    }
  </style>
  <script type="application/ld+json">

<body>
  <div id="boot">
    <span class="pill"><span class="dot"></span>Available for new roles</span>
    <h1>Abdisa Tsegaye</h1>
    <p>
      Full-stack developer in Addis Ababa. Flutter apps, TypeScript and Dart
      backends, and packages published on npm and pub.dev.
    </p>
    <div class="bar"><i></i></div>
    <div class="hint">Loading portfolio</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.style.opacity = 0;
      setTimeout(function () { boot.remove(); }, 480);
    });
  </script>
</body>
